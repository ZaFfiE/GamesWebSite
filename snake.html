<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Snake</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <h1>Snake</h1>
  </header>
  <main class="container">
    <section class="game-area">
      <canvas id="board" width="480" height="480" aria-label="Snake game" role="img"></canvas>
      <div class="hud">
        <div>Score: <span id="score">0</span></div>
        <div class="controls">Use Arrow Keys or WASD. Press Space to pause.</div>
        <div><a href="index.html"><- Back to games</a></div>
      </div>
    </section>
  </main>
  <script src="snake.js"></script>
</body>
</html>
